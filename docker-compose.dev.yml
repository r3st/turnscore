services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: turnscore_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d turnscore_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_SERVER_MODE: debug
      APP_SERVER_FRONTEND_URL: http://localhost:3000
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: turnscore_dev
      APP_DATABASE_USER: dev
      APP_DATABASE_PASSWORD: dev
      APP_DATABASE_SSLMODE: disable
      APP_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_AUTH_JWT_SECRET: dev-jwt-secret-not-for-production
      APP_STORAGE_BACKEND: local
      APP_STORAGE_LOCAL_PATH: /app/uploads
      APP_STORAGE_LOCAL_BASE_URL: http://localhost:8080
      APP_LOGGING_LEVEL: debug
      APP_LOGGING_FORMAT: pretty
    volumes:
      - ./backend:/app
      - uploads_dev_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  postgres_dev_data:
  uploads_dev_data:
