services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: turnscore
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d turnscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_SERVER_MODE: release
      APP_SERVER_FRONTEND_URL: ${FRONTEND_URL}
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: turnscore
      APP_DATABASE_USER: ${DB_USER}
      APP_DATABASE_PASSWORD: ${DB_PASSWORD}
      APP_DATABASE_SSLMODE: disable
      APP_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_AUTH_JWT_SECRET: ${JWT_SECRET}
      APP_STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      APP_STORAGE_LOCAL_PATH: /app/uploads
      APP_STORAGE_LOCAL_BASE_URL: ${BACKEND_URL}
      APP_STORAGE_S3_ENDPOINT: ${S3_ENDPOINT:-}
      APP_STORAGE_S3_BUCKET: ${S3_BUCKET:-}
      APP_STORAGE_S3_REGION: ${S3_REGION:-eu-central-1}
      APP_STORAGE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      APP_STORAGE_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      APP_LOGGING_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:8080}

volumes:
  postgres_data:
  uploads_data:
