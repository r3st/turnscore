# TurnScore — Production Docker Compose
# Copy .env.example to .env and fill in real values before running.
# Start: docker compose up -d
# Logs:  docker compose logs -f turnscore

networks:
  proxy:       # Traefik ↔ turnscore
  backend:     # turnscore ↔ postgres ↔ minio (never exposed externally)
  socket-proxy: # traefik ↔ socket-proxy only

volumes:
  postgres_data:
  minio_data:
  letsencrypt:

services:

  # ── Docker socket proxy (Traefik never touches /var/run/docker.sock directly) ──
  socket-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1
    restart: unless-stopped
    read_only: true
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      LISTENADDRESS: "0.0.0.0:2375"
      ALLOWFROM: "0.0.0.0/0"
      ALLOW_GET: "^/v[0-9.]+/containers/json$,^/version$,^/_ping$"
      LOGLEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # ── Traefik v3 — reverse proxy + TLS termination ─────────────────────────
  traefik:
    image: traefik:v3
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      - proxy
      - socket-proxy

  # ── TurnScore application ─────────────────────────────────────────────────
  turnscore:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_SERVER_MODE: release
      APP_SERVER_FRONTEND_URL: "https://${DOMAIN}"
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: turnscore
      APP_DATABASE_USER: ${DB_USER}
      APP_DATABASE_PASSWORD: ${DB_PASSWORD}
      APP_DATABASE_SSLMODE: disable
      APP_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_AUTH_JWT_SECRET: ${JWT_SECRET}
      APP_STORAGE_BACKEND: s3
      APP_STORAGE_S3_ENDPOINT: http://minio:9000
      APP_STORAGE_S3_BUCKET: ${MINIO_BUCKET:-turnscore}
      APP_STORAGE_S3_REGION: ${MINIO_REGION:-eu-central-1}
      APP_STORAGE_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_STORAGE_S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_LOGGING_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.turnscore.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.turnscore.entrypoints=websecure"
      - "traefik.http.routers.turnscore.tls.certresolver=letsencrypt"
      - "traefik.http.services.turnscore.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnscore
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d turnscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO init: create bucket + public read policy ────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-turnscore} &&
        mc anonymous set download local/$${MINIO_BUCKET:-turnscore} &&
        echo 'MinIO bucket ready.'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-turnscore}
    restart: "no"
